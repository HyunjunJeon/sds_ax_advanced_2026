<text x="736" y="320" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">이 두 칸은 분리의 근거가 아닙니다</text>
<text x="40" y="380" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">먼저 점검할 것을 고친 뒤에도 남는 실패나 비용이 분리를 검토할 근거입니다. 단계 의존성은 대개 근거가 못 됩니다.</text>
