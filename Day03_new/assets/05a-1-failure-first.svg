<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="05a-1-failure-first-title 05a-1-failure-first-desc">
<title id="05a-1-failure-first-title">나누기 전에 Single의 실패를 분류하는 순서</title>
<desc id="05a-1-failure-first-desc">Single 실행의 자동 검사와 신호표를 읽어 실패를 네 칸(정보 부족, 도구 선택, Context 크기, 단계 의존성)과 자동 검사 문제, 실패 아님으로 분류하고, 먼저 점검할 것을 고친 뒤에도 남는 실패와 비용만 분리의 근거로 삼는다.</desc>
