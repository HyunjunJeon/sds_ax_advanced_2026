<text x="748.0" y="192.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">same_failure</text>
<text x="748.0" y="208" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">같은 누락이 same_limit번 연속</text>
<rect x="576" y="232" width="344" height="80" rx="6" fill="#f5f5f5"/>
