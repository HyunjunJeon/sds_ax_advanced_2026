<path d="M432,176 L576,176" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#03b-2-loop-exits-arr)"/>
<path d="M432,192 L496,192 Q504,192 504,200 L504,264 Q504,272 512,272 L576,272" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#03b-2-loop-exits-arr)"/>
<path d="M352,208 L352,328 Q352,336 344,336 L128,336 Q120,336 120,328 L120,208" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#03b-2-loop-exits-arr-a)"/>
<text x="236" y="322" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">④ 그 밖: attempt로 되돌아갑니다</text>
<rect x="40" y="144" width="160" height="64" rx="6" fill="#f5f5f5"/>
