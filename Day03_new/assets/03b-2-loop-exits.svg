<rect x="576" y="40" width="344" height="80" rx="6" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1"/>
<text x="748.0" y="78.0" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2d3142">① 통과</text>
<text x="748.0" y="96.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">complete</text>
<text x="748.0" y="112" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">누락 항목이 없다</text>
