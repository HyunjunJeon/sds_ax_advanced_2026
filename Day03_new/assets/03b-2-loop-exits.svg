<rect x="272" y="144" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
<text x="352.0" y="174.0" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2d3142">검사</text>
<text x="352.0" y="192.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">check</text>
