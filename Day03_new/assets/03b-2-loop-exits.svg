<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-labelledby="03b-2-loop-exits-title 03b-2-loop-exits-desc">
<title id="03b-2-loop-exits-title">루프가 멈추는 길과 계속하는 길</title>
<desc id="03b-2-loop-exits-desc">check가 시도 결과를 위에서 아래로 판정해 누락이 없으면 complete, 같은 누락이 반복되면 same_failure, 시도 상한이면 retry_limit으로 멈추고, 그 밖에는 attempt로 되돌아간다.</desc>
