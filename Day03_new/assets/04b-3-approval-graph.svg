<rect x="426.0" y="192" width="48.0" height="20" fill="#f5f5f5"/>
<text x="450" y="206" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#4f5d75">allow</text>
<text x="280" y="77" text-anchor="end" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#4f5d75">금액 수정</text>
<text x="341" y="120" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#4f5d75">needs_approval</text>
<text x="598" y="130" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#4f5d75">승인</text>
<text x="450" y="36" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">interrupt: 재개하면 노드를 처음부터 다시 돕니다</text>
<text x="590" y="240" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">원장에 쓰는 곳은 여기뿐</text>
<text x="760" y="240" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">원장을 다시 읽음</text>
<text x="40" y="300" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">gate가 거절이거나 사람이 거절하면 execute를 거치지 않고 끝납니다. 멱등 키는 gate가 정합니다.</text>
