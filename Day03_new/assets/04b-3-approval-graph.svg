<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="04b-3-approval-graph-title 04b-3-approval-graph-desc">
<title id="04b-3-approval-graph-title">승인 그래프에서 부작용이 있는 자리</title>
<desc id="04b-3-approval-graph-desc">propose 뒤 gate가 검사하고 allow면 execute, needs_approval이면 approve에서 interrupt로 사람을 기다린다. approve는 승인되면 execute로, 금액이 바뀌면 gate로 돌아간다. 원장에 쓰는 일은 execute 한 곳뿐이고 verify가 원장을 다시 읽는다.</desc>
<defs><marker id="04b-3-approval-graph-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><marker id="04b-3-approval-graph-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker><marker id="04b-3-approval-graph-arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e5aa8"/></marker></defs>
