<text x="496" y="296" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="11" font-weight="500" fill="#5a6580">Worker가 늘고 걸러 낼 판단이 생기면 Hierarchical</text>
<text x="56" y="348" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="13" font-weight="600" fill="#bf4520">어느 칸에서 끝나든 돈을 움직이는 쓰기는 코드 게이트 하나(gate_answer)를 지납니다.</text>
<text x="56" y="368" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#2d3142">나누기 쉬운 것은 읽기(조사)이고, 쓰기와 결정은 한 곳에 모읍니다. 셋째와 넷째 질문은 다른 축이라 둘 다 예일 수 있습니다.</text>
