<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="05b-4-decision-flow-title 05b-4-decision-flow-desc">
<title id="05b-4-decision-flow-title">흩어진 선택 기준을 묻는 순서</title>
<desc id="05b-4-decision-flow-desc">코드로 정해지나, Single로 고쳐지나, 격리나 병렬이 필요한가, 주도권이 넘어가나를 차례로 묻는다. 예이면 아래 칸의 구조에서 멈추고, 모두 아니오이면 나누지 않는다. 어느 칸이든 돈을 움직이는 쓰기는 코드 게이트 하나를 지난다.</desc>
