<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="03b-3-orchestrator-flows-title 03b-3-orchestrator-flows-desc">
<title id="03b-3-orchestrator-flows-title">Orchestrator-Worker 조립에서 네 흐름이 있는 자리</title>
<desc id="03b-3-orchestrator-flows-desc">plan이 작업을 나누고 worker가 Send로 병렬 실행하고 aggregate가 합친 뒤 validate가 통과면 종료, 문제가 있으면 replan이 실패한 작업만 worker로 되돌려 보낸다.</desc>
