<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="04b-1-failure-actions-title 04b-1-failure-actions-desc">
<title id="04b-1-failure-actions-title">실패 종류에 따른 다음 행동</title>
<desc id="04b-1-failure-actions-desc">next_action이 실패 종류와 재시도 기회, 예산 여부에 따라 respond, reinvestigate, retry, escalate, stop_with_reason 중 하나를 고른다. 다시 부르는 행동은 reinvestigate와 retry뿐이다.</desc>
