<title id="05a-2-persona-vs-context-title">역할 이름만 다른 Worker와 도구 범위가 다른 Worker</title>
<desc id="05a-2-persona-vs-context-desc">위쪽 Persona는 이름만 다른 Worker 셋이 모든 도구를 보고 같은 Desk와 원장에 닿는다. 아래쪽 Context 분리는 ROLE_TOOLS로 Worker마다 보이는 도구가 다르지만 같은 Desk와 원장에 닿는 점은 같아서 보안 격리는 아니다.</desc>
