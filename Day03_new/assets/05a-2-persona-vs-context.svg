<text x="40" y="330" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">줄어드는 것은 보이는 도구와 넘기는 Context입니다. 두 경우 모두 같은 프로세스의 같은 객체에 닿으므로 Context 분리는 보안 격리가 아닙니다.</text>
