<text x="128.0" y="84" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">① 조건부 간선이 작업 표를 만듭니다</text>
