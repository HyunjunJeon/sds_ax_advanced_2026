<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="03a-3-send-fanout-title 03a-3-send-fanout-desc">
<title id="03a-3-send-fanout-title">Send로 같은 Node를 세 번 실행하는 흐름</title>
<desc id="03a-3-send-fanout-desc">dispatch가 Send 세 개를 돌려주면 work Node가 입력만 달리해 세 번 실행되고, 한 단계가 모두 끝나면 결과가 reducer가 붙은 results 칸에 합쳐진다.</desc>
