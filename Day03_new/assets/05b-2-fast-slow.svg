<text x="40" y="316" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">Fast와 Slow 모두 같은 validate와 gate를 지납니다. Fast가 건너뛰는 것은 조사의 폭이지 검증이 아닙니다.</text>
