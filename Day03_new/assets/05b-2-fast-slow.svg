<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="05b-2-fast-slow-title 05b-2-fast-slow-desc">
<title id="05b-2-fast-slow-title">hybrid의 Fast와 Slow 경로</title>
<desc id="05b-2-fast-slow-desc">Router가 Fast 또는 Worker 병렬로 보내고, Worker 결과는 join과 writer를 거쳐 validate로, Fast의 답은 바로 validate로 모인 뒤 gate로 간다. Fast에서 온 답이 근거 부족이면 validate가 worker로 되돌려 Slow로 전환한다.</desc>
