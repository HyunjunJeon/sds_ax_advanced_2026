<rect x="300" y="208" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="300" y="208" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
<text x="400.0" y="238.0" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2d3142">join_results</text>
<text x="400.0" y="256.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">작업별 상태 표</text>
<rect x="560" y="208" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="560" y="208" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>
<text x="660.0" y="238.0" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="14" font-weight="600" fill="#2d3142">after_visible_join</text>
<text x="660.0" y="256.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">failed만 새 키로 Send</text>
<text x="380.0" y="320" text-anchor="middle" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="500" fill="#4f5d75">outage#2만 다시 실행하고 billing, policy 결과는 그대로 둡니다</text>
<text x="776" y="100" text-anchor="start" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="12" font-weight="600" fill="#bf4520">실패의 흔적 없음</text>
