<text x="400.0" y="112.0" text-anchor="middle" font-family="'Geist Mono','SF Mono',Menlo,monospace" font-size="11" font-weight="500" fill="#5a6580">complete만 모읍니다</text>
<rect x="560" y="64" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="560" y="64" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
