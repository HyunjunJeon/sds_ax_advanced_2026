[project]
name = "day07"
version = "0.1.0"
description = "Day07"
requires-python = ">=3.13,<3.14"
# Day07 은 독립 프로젝트다. 의존성은 이 폴더의 uv.lock 으로 고정한다.
dependencies = [
  "deepagents==0.7.13",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langgraph==1.2.11",
  "langchain-openrouter==0.2.8",
  "openrouter==0.10.8",
  "deepeval==4.2.2",
  "langfuse==4.15.1",
  "openpyxl==3.1.5",
  "python-dotenv>=1.2,<2",
  "pymupdf4llm>=1.28.2",
  "langchain-openai>=1.6.2",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["."]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
