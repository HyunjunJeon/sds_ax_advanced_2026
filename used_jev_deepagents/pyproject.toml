[project]
name = "jev-deepagents-rag"
version = "0.1.0"
description = "Jev harness + Deep Agents RAG with Agent Chat UI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents>=0.7.13",
    "httpx>=0.28",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.7.9",
    "langchain-core>=1.6.2",
    "langchain-openrouter>=0.2.8",
    "langchain-text-splitters>=0.3.9",
    "langchain-typesafe[experimental]>=0.0.1a2",
    "langfuse>=4.15.4",
    "langgraph-cli[inmem]>=0.4.19",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "typesafe-sdk>=0.5.7",
]

[project.scripts]
jev-rag-ui = "src.dev:main"
jev-rag-bench = "src.bench:main"
jev-rag-workflow = "src.workflow_bench:main"
jev-rag-compare = "src.compare_run:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 비어 있어도 지우지 않는다. uv는 [tool.uv]가 없는 pyproject.toml을 건너뛰고 상위 폴더에서
# 설정을 찾는다. 이 테이블이 없으면 수업 저장소 루트의 exclude-newer를 물려받아
# `uv sync --locked`가 "lockfile needs to be updated"로 실패한다.
[tool.uv]
